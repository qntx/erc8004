[profile.default]
src            = "src"
out            = "out"
solc           = "0.8.24"
evm_version    = "shanghai"
optimizer      = true
optimizer_runs = 200
via_ir         = true
script         = "script"
libs           = ["dependencies"]
fs_permissions = [{ access = "read-write", path = "../target/e2e/" }]

[dependencies]
"@openzeppelin-contracts"             = "5.4.0"
"@openzeppelin-contracts-upgradeable" = "5.4.0"
forge-std                             = "1.9.4"
