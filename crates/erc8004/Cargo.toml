[package]
name                   = "erc8004"
description            = "ERC-8004 Trustless Agents Rust SDK."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories             = ["cryptography::cryptocurrencies", "api-bindings"]
readme                 = "README.md"
documentation          = "https://docs.rs/erc8004"
include                = ["src/**/*", "examples/**/*", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true

[features]
default  = ["provider", "fetch"]
provider = ["alloy/providers", "alloy/rpc-types-eth", "alloy/network", "dep:futures-util"]
fetch    = ["dep:reqwest"]

[dependencies]
alloy.workspace      = true
base64.workspace     = true
reqwest              = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
futures-util         = { version = "0.3", default-features = false, optional = true }
serde_json.workspace = true
thiserror.workspace  = true

[dev-dependencies]
alloy                = { workspace = true, features = ["json-abi", "provider-http", "signer-local", "reqwest", "reqwest-rustls-tls"] }
serde_json.workspace = true
tokio                = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[example]]
name              = "query_agent"
required-features = ["provider", "fetch"]

[[example]]
name              = "give_feedback"
required-features = ["provider"]

[[test]]
name              = "e2e"
path              = "tests/e2e.rs"
required-features = ["provider"]

[lints]
workspace = true
