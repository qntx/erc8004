# Caller owns on:. Pin at @v2.
# CARGO_REGISTRY_TOKEN must belong to an owner of all crates on crates.io.
name: Publish Crates

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  erc8004:
    uses: qntx/workflows/.github/workflows/publish-crates.yml@v2
    permissions:
      contents: read
    with:
      packages: erc8004
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
